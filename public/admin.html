<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trivia Night — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#08090f; --panel:#12131c; --panel2:#1a1b26; --line:rgba(255,255,255,.1);
  --gold:#d4a843; --gold-hi:#e8c874; --teal-hi:#3dd5c8; --ink:#f0ece4; --muted:rgba(255,255,255,.45);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--night);color:var(--ink);font-family:'Outfit',sans-serif;min-height:100vh;padding:24px 16px 60px;}
.wrap{max-width:720px;margin:0 auto;}
h1{font-family:'Playfair Display',serif;font-weight:900;font-size:34px;color:var(--gold);line-height:1;}
.sub{color:var(--muted);font-size:13px;letter-spacing:1px;text-transform:uppercase;margin:6px 0 24px;}
.lbl{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.row{display:flex;gap:8px;align-items:stretch;margin-bottom:20px;}
select{flex:1;min-width:0;background:var(--panel2);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:10px 12px;font-family:'Outfit',sans-serif;font-size:14px;}
button.pill{flex:0 0 auto;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:rgba(255,255,255,.8);font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;padding:0 16px;cursor:pointer;}
button.pill:hover{background:rgba(255,255,255,.14);}
.section{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.3);margin:22px 0 8px;}
table{border-collapse:collapse;width:100%;font-size:13px;}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid rgba(255,255,255,.06);}
th{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
th:first-child,td:first-child{text-align:left;}
.hit-ok{color:var(--teal-hi);} .hit-good{color:var(--gold-hi);} .hit-low{color:#e05c6e;}
tr.total td{border-top:2px solid rgba(255,255,255,.2);font-weight:700;color:#fff;}
tr.totalrow td{border-top:2px solid rgba(255,255,255,.25);font-weight:700;}
tr.totalrow td:first-child{color:#fff;}
.muted{color:var(--muted);text-align:center;padding:24px 0;}
.details{margin-top:8px;border-top:1px solid var(--line);padding-top:14px;display:none;}
.details.show{display:block;}
.dl{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.35);margin:14px 0 6px;}
.prose{font-size:13px;color:rgba(255,255,255,.75);line-height:1.55;background:rgba(255,255,255,.04);border-radius:8px;padding:12px;}
.meta{font-size:12px;color:var(--muted);margin-bottom:4px;}
.note{font-size:13px;color:rgba(255,255,255,.6);font-style:italic;margin-bottom:6px;}
.footer{margin-top:40px;font-size:11px;color:rgba(255,255,255,.25);text-align:center;}
a{color:var(--muted);}
.warn{background:rgba(212,168,67,.12);border:1px solid rgba(212,168,67,.4);color:var(--gold-hi);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px;}
.lowflag{font-size:9px;color:var(--muted);border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:1px 4px;margin-left:6px;text-transform:uppercase;letter-spacing:.5px;}
table.grid th{text-align:center;}
table.grid th:first-child,table.grid td:first-child{text-align:left;}
table.grid td.cell{text-align:center;font-size:12px;font-weight:700;min-width:52px;}
table.grid td.cell .cn{display:block;font-size:9px;font-weight:400;color:var(--muted);margin-top:1px;}
table.grid .lowflag{margin-left:0;}
table.grid td.empty{text-align:center;color:rgba(255,255,255,.15);}
table.grid td.dim{text-align:center;color:rgba(255,255,255,.4);font-weight:400;}
</style>
<style>
.assistbox{border:1px solid rgba(212,168,67,.3);background:rgba(212,168,67,.05);border-radius:10px;padding:14px;margin-bottom:22px;}
.assistbtn{background:var(--gold);color:#14120e;border:none;border-radius:8px;padding:9px 18px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;letter-spacing:.5px;}
.assistbtn:disabled{opacity:.55;cursor:default;}
.sqlwrap{position:relative;}
.spin{width:13px;height:13px;border:2px solid rgba(212,168,67,.25);border-top-color:var(--gold);border-radius:50%;display:inline-block;animation:spin .8s linear infinite;flex:0 0 auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.copyall{background:transparent;color:var(--gold);border:1px solid rgba(212,168,67,.5);border-radius:8px;padding:8px 14px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;}
.copyall:hover{background:rgba(212,168,67,.12);}
.copybtn{position:absolute;top:8px;right:8px;background:rgba(212,168,67,.85);color:#14120e;border:none;border-radius:6px;padding:4px 10px;font-family:inherit;font-size:10px;font-weight:800;cursor:pointer;letter-spacing:.5px;z-index:2;}
.copybtn:hover{background:var(--gold);}
.sqlbox{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:11px;overflow-x:auto;font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.5;white-space:pre;margin:8px 0;}
.tier3{width:100%;border-collapse:collapse;}
.tier3 th,.tier3 td{padding:7px 6px;text-align:center;font-size:12px;}
.tier3 thead th{font-size:9px;letter-spacing:1px;text-transform:uppercase;opacity:.55;border-bottom:1px solid rgba(255,255,255,.12);}
.tier3 thead th.mgrp{opacity:1;font-weight:800;}
.tier3 .mgrp{border-left:1px solid rgba(255,255,255,.12);}
.tier3 tbody td{border-bottom:1px solid rgba(255,255,255,.06);}
.tier3 .tcell{text-align:left;font-weight:700;}
.tier3 .tgt{opacity:.5;}
.tier3 .frac{opacity:.4;font-size:10px;}
.tier3 .none{opacity:.25;}
.tier3 .lown{font-size:9px;opacity:.5;}
.tier3 .vsprior{font-size:9.5px;font-weight:700;margin-top:2px;letter-spacing:.2px;}
/* Collapsible sections. The page holds four unrelated jobs — the ruleset's
   definition, how it's performing, what the AI makes of it, and live-server
   operations. Flat, they read as one undifferentiated list and the Details
   panel opened 800px below the button that opened it. */
.panel{border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02);margin-bottom:14px;overflow:hidden;}
.panel>.phead{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:none;
  padding:14px 16px;cursor:pointer;font-family:inherit;color:var(--ink);text-align:left;}
.panel>.phead:hover{background:rgba(255,255,255,.04);}
.panel>.phead .ptitle{font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.75);}
.panel>.phead .psub{font-size:11px;color:var(--muted);margin-left:auto;text-align:right;}
.panel>.phead .chev{flex:0 0 auto;font-size:11px;color:var(--muted);transition:transform .18s ease;}
.panel.open>.phead .chev{transform:rotate(90deg);}
.panel>.pbody{display:none;padding:0 16px 18px;}
.panel.open>.pbody{display:block;}
/* Operations is destructive and unrelated to reading — set apart, not stacked in. */
.panel.ops{border-color:rgba(192,57,43,.28);background:rgba(192,57,43,.03);margin-top:26px;}
.panel.ops>.phead .ptitle{color:#ff9b8e;}
/* The definition pane lives inside a panel now, so it no longer hides itself. */
.details{margin-top:0;border-top:none;padding-top:0;display:block;}
.details.show{display:block;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Trivia Night</h1>
  <div class="sub">Admin · Ruleset Calibration</div>

  <!-- The picker governs Definition and Reporting alike, so it sits above both
       and outside every panel — collapsing it would hide what everything means. -->
  <div class="lbl">Difficulty Ruleset</div>
  <div class="row">
    <select id="rsSelect" style="max-width:100%;text-overflow:ellipsis;"></select>
  </div>

  <div class="panel" id="panelDef">
    <button class="phead" data-panel="panelDef">
      <span class="chev">▶</span>
      <span class="ptitle">Definition</span>
      <span class="psub">What this ruleset asks for</span>
    </button>
    <div class="pbody">
      <div class="details show" id="detailsPane"></div>
    </div>
  </div>

  <div class="panel open" id="panelRep">
    <button class="phead" data-panel="panelRep">
      <span class="chev">▶</span>
      <span class="ptitle">Reporting</span>
      <span class="psub">How it is actually performing</span>
    </button>
    <div class="pbody">
      <div id="statsArea"><div class="muted">Loading…</div></div>
    </div>
  </div>

  <div class="panel open" id="panelAI">
    <button class="phead" data-panel="panelAI">
      <span class="chev">▶</span>
      <span class="ptitle">Analysis</span>
      <span class="psub">What to change, and why</span>
    </button>
    <div class="pbody">
      <div id="assistArea"></div>
    </div>
  </div>

  <div class="panel ops" id="panelOps">
    <button class="phead" data-panel="panelOps">
      <span class="chev">▶</span>
      <span class="ptitle">Operations</span>
      <span class="psub">Acts on the live server</span>
    </button>
    <div class="pbody">
      <div class="meta" style="margin-bottom:10px;">Ends every room in progress. Any shared or personal screen still connected drops back to its start screen.</div>
      <button id="resetRooms" style="background:transparent;border:1.5px solid rgba(192,57,43,.55);color:#ff8b7d;
        border-radius:10px;padding:9px 14px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;">
        Close every open room
      </button>
      <span id="resetRoomsMsg" style="margin-left:10px;font-size:12px;opacity:.75;"></span>
      <div id="buildFooter" style="margin:16px 0 0;font-size:10px;line-height:1.6;opacity:.6;"></div>
    </div>
  </div>

  <div class="footer">View-only. Data reads live from the game database.</div>
</div>

<script>
// Targets are DERIVED from the selected ruleset's tiers + the selected mode's nudge —
// never hardcoded, or admin would silently disagree with what the app actually asked for.
// These fallbacks must match DEFAULT_RULESET in index.html.
const FALLBACK_TIERS=[75,66,50,33,20];
const FALLBACK_EASY_NUDGE=15, FALLBACK_HARD_NUDGE=-15;
let TARGET_RATES={100:75,200:66,300:50,400:33,500:20};   // recomputed on every load
let MODE='normal';

// Targets belong to a VERSION, not to the page. Comparing v3 against v2 means
// measuring each against ITS OWN targets — if v3 moved a target, the two versions'
// raw hit rates are not the same measurement and must never be subtracted.
function targetsForVersion(version, mode){
  const r=RULESETS.find(x=>x.difficulty_ruleset_version===version)||{};
  const tiers=Array.isArray(r.tiers)&&r.tiers.length===5
    ? r.tiers.map(t=>Number(t.pct))
    : FALLBACK_TIERS;
  let nudge=0;
  if(mode==='easy') nudge=(r.easy_nudge==null?FALLBACK_EASY_NUDGE:Number(r.easy_nudge));
  else if(mode==='hard') nudge=(r.hard_nudge==null?FALLBACK_HARD_NUDGE:Number(r.hard_nudge));
  const pts=[100,200,300,400,500];
  const out={};
  tiers.forEach((pct,i)=>{
    out[pts[i]]=Math.max(15,Math.min(90,Math.round(pct+nudge)));   // same clamp as the app
  });
  return out;
}
function targetsForMode(mode){ return targetsForVersion(SELECTED, mode); }

// The version immediately before the selected one that has ANY answers at all.
// Deliberately NOT "the previous version with enough data": skipping a thin
// version would hide it from the reader entirely. Show it, mark it thin, let
// the reader decide what it's worth.
function priorVersionWithData(byVersion){
  const vs=Object.keys(byVersion||{}).map(Number).filter(v=>v<SELECTED).sort((a,b)=>b-a);
  return vs.length?vs[0]:null;
}
// Gap from target for one version/mode/tier. null when that cell was never played.
function gapAt(byVersion, version, mode, tier){
  const d=(((byVersion||{})[version]||{})[mode]||{})[tier];
  if(!d||!d.att) return null;
  const tgt=targetsForVersion(version, mode)[tier];
  return { gap: Math.round(d.ok/d.att*100)-tgt, n: d.att };
}
function recomputeTargets(){ TARGET_RATES=targetsForMode(MODE); }
// Mode colours deliberately avoid teal/gold/red — those mean "on target",
// "running easy" and "running hard" in the cells, and would read as a verdict.
const MODE_COLS=[
  {key:'easy',  label:'Easier', col:'#6ea8ff'},
  {key:'normal',label:'Normal', col:'rgba(255,255,255,.82)'},
  {key:'hard',  label:'Harder', col:'#a78bfa'},
];
const LOW=25;    // fewer answers than this = statistically insufficient (flagged everywhere)
const NOISY=50;  // overall: fewer answers than this = whole ruleset is noisy
let RULESETS=[]; let SELECTED=null;

async function api(path){
  const r=await fetch(path);
  return await r.json();
}

function catExpected(ct){
  let w=0,n=0;
  Object.keys(ct||{}).forEach(t=>{ const a=ct[t].att; w+=(TARGET_RATES[t]||0)*a; n+=a; });
  return n>0?Math.round(w/n):0;
}

function tierTable(_ignored, tiersByMode, byVersion){
  const tiers=[100,200,300,400,500];
  const prior=priorVersionWithData(byVersion);
  // Spectrum order: Easier <- Normal -> Harder (baseline centred)
  const modes=MODE_COLS;
  const T={}; modes.forEach(m=>{ T[m.key]=targetsForMode(m.key); });

  let h='<table class="tier3"><thead>';
  h+='<tr><th></th>';
  modes.forEach(m=>{ h+=`<th colspan="2" class="mgrp" style="color:${m.col};">${m.label}</th>`; });
  h+='</tr><tr><th>Tier</th>';
  modes.forEach(()=>{ h+='<th class="mgrp">Actual</th><th>Target</th>'; });
  h+='</tr></thead><tbody>';

  tiers.forEach(t=>{
    h+=`<tr><td class="tcell">${t}</td>`;
    modes.forEach(m=>{
      const d=((tiersByMode||{})[m.key]||{})[t];
      const att=(d&&d.att)||0, ok=(d&&d.ok)||0;
      const tgt=T[m.key][t];
      if(att===0){
        h+=`<td class="mgrp none">—</td><td class="tgt">${tgt}%</td>`;
      } else {
        const pct=Math.round(ok/att*100);
        const diff=pct-tgt;
        const low=att<LOW;
        const cls=low?'':(Math.abs(diff)<=10?'hit-ok':(diff>0?'hit-good':'hit-low'));
        const lowTag=low?` <span class="lown">low n</span>`:'';
        // "vs prior" compares GAP FROM TARGET, never raw hit rate — see targetsForVersion.
        // Positive = this version sits closer to its target than the last one did.
        let vs='';
        if(prior!==null){
          const a=gapAt(byVersion, prior, m.key, t);
          if(a){
            const moved=Math.abs(diff)-Math.abs(a.gap);   // negative = closer to target now
            const better=moved<0;
            const thin=(a.n<LOW)||low;
            const col=thin?'rgba(255,255,255,.42)':(better?'var(--good,#4cd4a0)':'#ff8b7d');
            const arrow=moved===0?'=':(better?'▲':'▼');
            vs=`<div class="vsprior" style="color:${col};" title="v${prior}: ${a.gap>0?'+':''}${a.gap} vs target (n=${a.n}) → v${SELECTED}: ${diff>0?'+':''}${diff}">`+
               `${arrow} ${Math.abs(moved)} vs v${prior}${thin?' ·thin':''}</div>`;
          }
        }
        h+=`<td class="mgrp ${cls}" title="${ok}/${att} · target ${tgt}%">`+
           `<b>${pct}%</b> <span class="frac">(${ok}/${att})</span>${lowTag}${vs}</td>`+
           `<td class="tgt">${tgt}%</td>`;
      }
    });
    h+='</tr>';
  });
  h+='</tbody></table>';
  h+='<div class="meta" style="margin-top:6px;">Each mode is compared against <b>its own</b> target (Normal targets shifted by the ruleset\'s nudge). Actual shows hit rate with (correct/attempts). "low n" = under '+LOW+' answers — ignore it. "—" = no games played in that mode yet.</div>';
  if(prior!==null){
    h+='<div class="meta" style="margin-top:4px;">▲ / ▼ compares <b>distance from target</b> against v'+prior+' — not raw hit rate, since targets can differ between versions. ▲ = closer to target now, ▼ = further away. Greyed and marked <i>·thin</i> when either side has under '+LOW+' answers: still shown, but don\'t lean on it.</div>';
  }
  return h;
}

function cellHTML(obj, target){
  if(!obj||obj.att===0) return '<td class="empty">·</td>';
  const pct=Math.round(obj.ok/obj.att*100), diff=pct-target;
  const cls='cell '+(Math.abs(diff)<=10?'hit-ok':diff>0?'hit-good':'hit-low');
  const sub=obj.att<LOW?`<span class="lowflag">low n (${obj.att})</span>`:`n=${obj.att}`;
  return `<td class="${cls}" title="${obj.ok}/${obj.att} · target ${target}%">${pct}%<div class="cn">${sub}</div></td>`;
}
function overallCell(obj, exp){
  if(!obj||obj.att===0) return '<td class="empty">·</td>';
  const pct=Math.round(obj.ok/obj.att*100), diff=pct-exp;
  const cls='cell '+(Math.abs(diff)<=10?'hit-ok':diff>0?'hit-good':'hit-low');
  const tail=obj.att<LOW?`<span class="lowflag">low n (${obj.att})</span>`:`n=${obj.att}`;
  return `<td class="${cls}" title="${obj.ok}/${obj.att} · expected ${exp}%">${pct}%<div class="cn">${tail}</div></td>`;
}
function expectedCell(obj, exp){
  if(!obj||obj.att===0) return '<td class="empty">·</td>';
  return `<td class="cell" style="color:var(--muted);font-weight:400;">${exp}%</td>`;
}
function matrixTable(s){
  const tiers=[100,200,300,400,500];
  const byCatTier=s.byCatTier||{}, byCat=s.byCat||{}, byTier=s.byTier||{};
  // Rows come from every mode's categories — so switching to a mode with no data
  // still shows the full grid (empty cells), never a blank page that traps you.
  const cats=(s.categoriesAll&&s.categoriesAll.length)
    ? s.categoriesAll.slice().sort()
    : Object.keys(byCatTier).sort();
  if(!cats.length) return '<div class="muted">No data.</div>';
  const empty=(s.total||0)===0
    ? '<div class="muted" style="font-size:11px;margin-bottom:8px;">No games played in this mode yet — the grid below is empty.</div>'
    : '';
  let h=empty+'<div style="overflow-x:auto;"><table class="grid"><tr><th>Category</th>';
  tiers.forEach(t=>h+=`<th>${t}</th>`);
  h+='<th>Overall</th><th>Expected</th></tr>';
  cats.forEach(cat=>{
    h+=`<tr><td>${cat}</td>`;
    tiers.forEach(t=>{ h+=cellHTML((byCatTier[cat]||{})[t], TARGET_RATES[t]); });
    const exp=catExpected(byCatTier[cat]);
    h+=overallCell(byCat[cat], exp);
    h+=expectedCell(byCat[cat], exp);
    h+='</tr>';
  });
  // Totals row: per-tier column totals + grand total
  h+='<tr class="totalrow"><td>Total</td>';
  let gW=0,gN=0;
  tiers.forEach(t=>{
    h+=cellHTML(byTier[t], TARGET_RATES[t]);
    const a=(byTier[t]&&byTier[t].att)||0; gW+=TARGET_RATES[t]*a; gN+=a;
  });
  const gExp=gN>0?Math.round(gW/gN):0;
  // Grand Overall/Expected blend floats with what players picked, so it's not a
  // reliable calibration signal — leave those two corner cells blank.
  h+='<td class="empty"></td><td class="empty"></td>';
  h+='</tr></table></div>';
  h+='<div class="meta" style="margin-top:6px;">Rows = categories, columns = point tiers. Tier cells compare actual vs that tier’s target; Overall compares actual vs the Expected column (targets blended by how often each tier was asked). “low n (#)” = fewer than '+LOW+' answers, with the count shown.</div>';
  return h;
}

let LAST_STATS=null;      // stashed by loadStats so the assistant can analyse what you're seeing
let LAST_ANALYSIS='';    // raw markdown of the last analysis, for Copy analysis

async function copyText(txt, btn){
  const original=btn.textContent;
  try{
    await navigator.clipboard.writeText(txt);
    btn.textContent='Copied \u2713';
  }catch(e){
    // clipboard can be blocked (http, permissions) — fall back to a hidden textarea
    const ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); btn.textContent='Copied \u2713'; }
    catch(e2){ btn.textContent='Copy failed'; }
    document.body.removeChild(ta);
  }
  setTimeout(()=>{ btn.textContent=original; },1500);
}

// Compact, factual payload. Every cell keeps its sample size so the model can judge
// what it's allowed to conclude — and can tell us where we simply don't have data yet.
function buildAnalysisPayload(){
  const s=LAST_STATS;
  if(!s) return null;
  const r=RULESETS.find(x=>x.difficulty_ruleset_version===SELECTED)||{};
  const tiers=[100,200,300,400,500];
  const modes=['easy','normal','hard'];
  const MODE_LABEL={easy:'Easier',normal:'Normal',hard:'Harder'};

  const byMode={};
  modes.forEach(m=>{
    const T=targetsForMode(m);
    byMode[MODE_LABEL[m]]=tiers.map(t=>{
      const d=((s.tiersByMode||{})[m]||{})[t]||{att:0,ok:0};
      return {
        tier:t, target_pct:T[t], attempts:d.att, correct:d.ok,
        actual_pct: d.att>0?Math.round(d.ok/d.att*100):null,
        gap: d.att>0?Math.round(d.ok/d.att*100)-T[t]:null
      };
    });
  });

  // Category x tier for the mode currently on screen
  const catRows=[];
  (s.categoriesAll||[]).forEach(cat=>{
    const row={category:cat, tiers:{}};
    tiers.forEach(t=>{
      const d=((s.byCatTier||{})[cat]||{})[t];
      row.tiers[t]= d&&d.att ? {attempts:d.att, actual_pct:Math.round(d.ok/d.att*100), target_pct:TARGET_RATES[t]} : null;
    });
    catRows.push(row);
  });

  // The assistant needs the WHOLE row — including the tier anchors (the prose that
  // actually drives generation) and every field it must copy into new SQL.
  const current_ruleset={
    difficulty_ruleset_version:SELECTED,
    note:r.note||null,
    model:r.model||null,
    reference_player:r.reference_player||null,
    audience_note:r.audience_note||null,
    judge_prompt:r.judge_prompt||null,
    tiers:r.tiers||null,
    category_overrides:r.category_overrides||null,
    quality_rules:r.quality_rules||null,
    self_check:r.self_check||null,
    explain_cats:r.explain_cats||null,
    easy_nudge:(r.easy_nudge==null?FALLBACK_EASY_NUDGE:r.easy_nudge),
    hard_nudge:(r.hard_nudge==null?FALLBACK_HARD_NUDGE:r.hard_nudge),
    _note_on_nulls:'A null field means this row does not set it; the app falls back to its built-in default. Copy nulls as-is unless you are changing them.'
  };
  // EVERY version's per-tier record, oldest first. Without this the assistant can
  // only say "how far off are we", never "did the last change help or hurt" — and
  // the second question is the one that actually decides what to do next.
  // Gaps are computed per version against ITS OWN targets, so a version that moved
  // a target is still comparable. Thin versions are included and flagged, not
  // dropped: a version that flopped after nine answers is real history.
  const bv=s.byVersion||{};
  const version_history=Object.keys(bv).map(Number).sort((a,b)=>a-b).map(v=>{
    const rr=RULESETS.find(x=>x.difficulty_ruleset_version===v)||{};
    const per={};
    modes.forEach(m=>{
      const T=targetsForVersion(v,m);
      const rows=tiers.map(t=>{
        const d=((bv[v]||{})[m]||{})[t];
        if(!d||!d.att) return {tier:t, target_pct:T[t], attempts:0, actual_pct:null, gap:null};
        const pct=Math.round(d.ok/d.att*100);
        return {tier:t, target_pct:T[t], attempts:d.att, actual_pct:pct, gap:pct-T[t],
                thin:d.att<LOW};
      });
      if(rows.some(r=>r.attempts>0)) per[MODE_LABEL[m]]=rows;
    });
    const n=Object.values((bv[v]||{})).reduce((acc,byT)=>acc+Object.values(byT).reduce((a,d)=>a+d.att,0),0);
    return {
      difficulty_ruleset_version:v,
      is_selected:v===SELECTED,
      note:rr.note||null,
      total_answers:n,
      thin_overall:n<LOW,
      tiers_definition:rr.tiers||null,
      easy_nudge:(rr.easy_nudge==null?FALLBACK_EASY_NUDGE:rr.easy_nudge),
      hard_nudge:(rr.hard_nudge==null?FALLBACK_HARD_NUDGE:rr.hard_nudge),
      by_mode:per
    };
  });

  return {
    min_sample_size:LOW,
    current_ruleset,
    stats:{
      by_mode:byMode,
      category_matrix:{mode:MODE_LABEL[MODE], rows:catRows},
      total_answers:s.totalAll||0
    },
    version_history
  };
}

function analysisPrompt(payload){
  return `You are a game-difficulty calibration analyst for a bilingual family trivia app (adults and kids play together).

HOW THE SYSTEM ACTUALLY WORKS - read carefully, this determines which lever you should pull:

Questions are generated by an LLM. For each tier, the generation prompt contains:
  - a TIER ANCHOR (a prose description of the intended difficulty, e.g. "Jeopardy! regular round style")
  - a TARGET hit rate, phrased as: "a typical reference player should answer this correctly about X% of the time"
  - a REFERENCE PLAYER description (who that "typical player" is)

CRITICAL CAUSAL DIRECTION: the target is an INPUT to generation, not a passive yardstick.
  - RAISING a target makes the generator produce EASIER questions.
  - LOWERING a target makes the generator produce HARDER questions.
If a tier is coming out too hard (actual far BELOW target), lowering its target would make it HARDER STILL. That is the opposite of a fix. Do not make this mistake.

YOU HAVE THREE DIFFERENT LEVERS. Choose deliberately and say which one you are pulling:
  1. ANCHORS / REFERENCE PLAYER (prose in the prompt). Use when the GOAL is right but the generator keeps missing it - e.g. an anchor that points at elite-level trivia when the audience is a family. This is usually the right lever when actual is far from target.
  2. TARGETS (the tier percentages). Use when the GOAL ITSELF is wrong - i.e. we have decided we want the game to feel different. Changing a target to make a chart look green, without changing the player experience, is MOVING THE GOALPOSTS and is wrong. Only recommend it if you argue explicitly that the new target is the difficulty we actually want.
  3. NUDGES (easy_nudge / hard_nudge). These already exist as the intentional "move the goalposts" mechanism for the Easier/Harder modes. Only touch them with Easier/Harder data.

DATABASE SCHEMA - the table is difficulty_rulesets. Any SQL you write MUST match it exactly:
  difficulty_ruleset_version  integer  (primary key; a change = a NEW version, never an edit)
  note                        text
  model                       text
  reference_player            text
  audience_note               text
  judge_prompt                text
  tiers                       jsonb    -- array of 5: [{"name":"Easy","pct":75,"anchor":"..."}, ...]
  category_overrides          jsonb    -- object keyed by category name
  quality_rules               jsonb    -- array of rule strings
  self_check                  text
  explain_cats                jsonb    -- array of category names
  easy_nudge                  integer
  hard_nudge                  integer
There are NO columns like tier_200_target_normal. Tiers live inside the "tiers" JSONB array.

THE CURRENT RULESET ROW (copy every field you are not changing):
${JSON.stringify(payload.current_ruleset,null,2)}

THE DATA (selected ruleset, v${payload.current_ruleset.difficulty_ruleset_version}):
${JSON.stringify(payload.stats,null,2)}

EVERY RULESET VERSION THAT HAS BEEN PLAYED, oldest first. Each version's gaps are
computed against ITS OWN targets, so versions remain comparable even when a target
was moved between them. \`thin: true\` marks a cell with too few answers to trust;
thin versions are included rather than hidden, so you can see history that exists
but cannot be leaned on:
${JSON.stringify(payload.version_history,null,2)}

RULES YOU MUST FOLLOW:
1. A cell with fewer than ${payload.min_sample_size} attempts is NOT evidence. Never draw a conclusion from it, in any direction.
2. Where data is missing or too thin, SAY SO EXPLICITLY and say what to play to fill the gap. This is one of your most valuable outputs.
3. A gap within +/-10 points is fine. Do not recommend changes for it.
4. Never invent a finding to seem useful. "The data does not support a conclusion here" is a valid answer.
5. Look at the SHAPE of the misses, not just their size. If some tiers hit and others miss, ask what is different about the ones that miss (their anchors? their reference points?) rather than assuming everything is uniformly off.
6. Be concrete: name the tier, mode, actual vs target, and sample size behind every claim.
7. COMPARE VERSIONS, DO NOT JUST MEASURE THIS ONE. The most valuable question you can answer is "did the last change help or hurt?" Work it out from version_history and say so plainly.
8. When comparing versions, compare GAP FROM TARGET, never raw hit rate. If a version moved a target, its raw rate means something different and subtracting the two is meaningless.
9. A change that moved a tier AWAY from its target is evidence the lever was pulled the wrong way. Say that outright and consider reverting rather than compounding it. Re-read the CAUSAL DIRECTION section before concluding which way to move.
10. If a previous version was closer to target than the current one, treat its settings as evidence about what worked - not as an obsolete thing to be improved on.

Respond in this exact structure:

## Did the last change help?
Compare the selected version against the one before it, gap-by-gap. Say plainly whether it improved, worsened, or is too thin to tell - and name the tiers and modes that moved most. If there is only one version, say so and skip to the next section.

## What the data says
Findings backed by at least ${payload.min_sample_size} attempts. Include the shape of the pattern, not just a list.

## Where we lack data
Which modes/tiers/categories are too thin to judge, and what to play to fix it.

## Diagnosis
WHY are the misses happening? Which lever is at fault - anchors/reference player, or genuinely wrong targets? Argue it.

## Recommendation
Which lever to pull and exactly what to change. If you recommend changing a target, you must justify that the NEW target is the difficulty we actually want - not merely that it would close the gap on the chart.

## SQL
If (and only if) you recommend a change: a complete INSERT for a NEW difficulty_ruleset_version, matching the schema above exactly, copying every unchanged field from the current ruleset. Otherwise write "No change recommended."

Be concise. No preamble.`;
}

async function runAssistant(){
  const out=document.getElementById('assistOut');
  const btn=document.getElementById('assistBtn');
  const payload=buildAnalysisPayload();
  if(!payload){ out.innerHTML='<div class="muted">Load stats first.</div>'; return; }
  btn.disabled=true; btn.textContent='Analyzing…';

  // This call takes a while (big prompt, long answer). Without a live indicator it
  // reads as hung — so show cycling status plus a running clock.
  const steps=[
    'Reading the tier and mode numbers…',
    'Checking which cells have enough data to trust…',
    'Looking for the shape of the misses…',
    'Working out which lever is at fault…',
    'Drafting the recommendation…',
    'Writing the SQL…',
    'Almost there — long answers take a moment…'
  ];
  let si=0, t0=Date.now();
  const paint=()=>{
    const secs=Math.floor((Date.now()-t0)/1000);
    out.innerHTML='<div class="muted" style="display:flex;align-items:center;gap:10px;">'+
      '<span class="spin"></span>'+
      `<span>${steps[Math.min(si,steps.length-1)]} <span style="opacity:.55;">(${secs}s)</span></span>`+
    '</div>';
  };
  paint();
  const tick=setInterval(paint,1000);
  const advance=setInterval(()=>{ if(si<steps.length-1) si++; },5000);
  const stop=()=>{ clearInterval(tick); clearInterval(advance); };

  try{
    const r=await fetch('/api/claude',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:2000,
        messages:[{role:'user',content:analysisPrompt(payload)}]})
    });
    if(!r.ok) throw new Error('proxy '+r.status);
    const d=await r.json();
    const txt=(d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    stop();
    LAST_ANALYSIS=txt||'';
    out.innerHTML=mdToHTML(txt||'(empty response)');
    wireCopyButtons(out);
    const ca=document.getElementById('assistCopyAll');
    if(ca && LAST_ANALYSIS){ ca.style.display='inline-block'; }
  }catch(e){
    stop();
    out.innerHTML='<div class="muted">Analysis failed — '+(e.message||'try again')+'.</div>';
  }
  btn.disabled=false; btn.textContent='Analyze';
}

// Minimal markdown: headings, bold, code blocks, bullets
function mdToHTML(t){
  const esc=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const blocks=t.split(/```(?:sql)?/);
  let h='';
  blocks.forEach((b,i)=>{
    if(i%2===1){
      const id='sql'+i;
      h+=`<div class="sqlwrap"><button class="copybtn" data-copy="${id}">Copy</button>`+
         `<pre class="sqlbox" id="${id}">${esc(b.trim())}</pre></div>`;
      return;
    }
    b.split('\n').forEach(line=>{
      const l=line.trim();
      if(!l){ h+=''; return; }
      if(l.startsWith('## ')) h+=`<div class="section" style="margin-top:16px;">${esc(l.slice(3))}</div>`;
      else if(l.startsWith('# ')) h+=`<div class="section" style="margin-top:16px;">${esc(l.slice(2))}</div>`;
      else if(/^[-*]\s/.test(l)) h+=`<div style="margin:3px 0 3px 14px;">• ${esc(l.slice(2)).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}</div>`;
      else h+=`<div style="margin:6px 0;line-height:1.55;">${esc(l).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}</div>`;
    });
  });
  return h;
}

// One dot per RULESET VERSION — the only axis on which anything actually changes.
// (It used to plot ten equal slices of one version's answer history. Inside a
// single version nothing varies but sampling noise, so that line only ever showed
// an average settling down — a confidence property, not a trend. Confidence is
// already carried per-number by "low n", so the axis was spent on nothing.)
function versionChart(byVersion){
  const versions=Object.keys(byVersion||{}).map(Number).sort((a,b)=>a-b);
  if(versions.length<2) return '<div class="muted">Only one ruleset version has answers so far — a comparison needs at least two. The table above carries the numbers until then.</div>';

  // A version's gap = its tiers' gaps, weighted by how often each tier was asked.
  // Each version is measured against ITS OWN targets, so 0 means "on target" for
  // every version alike even when the targets themselves changed between them.
  function pointsFor(mode){
    return versions.map(v=>{
      const T=targetsForVersion(v, mode);
      const byTier=((byVersion[v]||{})[mode])||{};
      let wActual=0, wTarget=0, n=0;
      Object.keys(byTier).forEach(t=>{
        const d=byTier[t]; if(!d.att) return;
        wActual+=(d.ok/d.att*100)*d.att;
        wTarget+=(T[t]||0)*d.att;
        n+=d.att;
      });
      return n>0 ? {v, gap:Math.round((wActual-wTarget)/n), n} : {v, gap:null, n:0};
    });
  }

  const series=MODE_COLS.map(m=>({...m, pts:pointsFor(m.key)}))
                        .filter(s2=>s2.pts.filter(p=>p.gap!==null).length>=1);
  if(!series.length) return '<div class="muted">No answers recorded against any ruleset yet.</div>';

  const W=680,H=170,padX=34,padY=30;
  const x=i=>padX+(W-2*padX)*(versions.length===1?0:i/(versions.length-1));
  const LIM=40;                                   // clamp the axis to +/-40 points of gap
  const y=g=>H/2-((H-2*padY)/2)*(Math.max(-LIM,Math.min(LIM,g))/LIM);

  let grid='';
  [30,15,0,-15,-30].forEach(g=>{
    const zero=g===0;
    grid+=`<line x1="${padX}" y1="${y(g).toFixed(1)}" x2="${W-padX}" y2="${y(g).toFixed(1)}" stroke="rgba(255,255,255,${zero?'.35':'.07'})" stroke-width="${zero?1.5:1}"/>`;
    grid+=`<text x="2" y="${(y(g)+3).toFixed(1)}" fill="rgba(255,255,255,${zero?'.5':'.28'})" font-size="9">${g>0?'+':''}${g}</text>`;
  });
  // Version labels along the bottom — the axis is now something you can point at.
  versions.forEach((v,i)=>{
    grid+=`<text x="${x(i).toFixed(1)}" y="${H-6}" fill="rgba(255,255,255,.45)" font-size="10" text-anchor="middle">v${v}</text>`;
  });

  let paths='',dots='',legend='';
  series.forEach(s2=>{
    // Break the line across versions a mode was never played in, rather than
    // drawing straight through a gap it has no data for.
    let run=[];
    const flush=()=>{
      if(run.length>=2) paths+=`<polyline points="${run.join(' ')}" fill="none" stroke="${s2.col}" stroke-width="2"/>`;
      run=[];
    };
    s2.pts.forEach((p,i)=>{
      if(p.gap===null){ flush(); return; }
      run.push(`${x(i).toFixed(1)},${y(p.gap).toFixed(1)}`);
    });
    flush();
    dots+=s2.pts.map((p,i)=>{
      if(p.gap===null) return '';
      const thin=p.n<LOW;                          // don't imply confidence in a thin version
      return `<circle cx="${x(i).toFixed(1)}" cy="${y(p.gap).toFixed(1)}" r="${thin?2.4:3.6}" fill="${thin?'transparent':s2.col}" stroke="${s2.col}" stroke-width="1.4"><title>${s2.label} · v${p.v}: ${p.gap>0?'+':''}${p.gap} pts vs target · n=${p.n}${thin?' (thin)':''}</title></circle>`;
    }).join('');
    legend+=`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;"><span style="width:14px;height:2px;background:${s2.col};display:inline-block;"></span><span style="color:${s2.col};font-weight:700;">${s2.label}</span></span>`;
  });

  return `<div style="font-size:11px;margin-bottom:6px;">${legend}</div>`+
    `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">${grid}${paths}${dots}</svg>`+
    `<div class="meta">Distance from target, one point per ruleset version (oldest → newest). <b>0 = on target.</b> Above the line = running easier than intended; below = harder. Each version is measured against its own targets, so a version that moved a target is still comparable. Hollow dots are thin versions (under ${LOW} answers) — shown, but don't lean on them.</div>`;
}

async function loadStats(){
  const area=document.getElementById('statsArea');
  area.innerHTML='<div class="muted">Loading…</div>';
  if(SELECTED==null){ area.innerHTML='<div class="muted">No ruleset selected.</div>'; return; }
  let s;
  recomputeTargets();
  try{ s=await api('/api/stats/tiers?ruleset='+encodeURIComponent(SELECTED)+'&mode='+encodeURIComponent(MODE)); }
  catch(e){ area.innerHTML='<div class="muted">Couldn’t reach the server. Reload in a moment.</div>'; return; }
  LAST_STATS=s;
  if(!s){ area.innerHTML='<div class="muted">Couldn\u2019t read stats. Reload in a moment.</div>'; return; }
  // A ruleset with no attempts still renders in full — empty tables, selectors intact.
  // (Never blank the page: it strands you with no way back.)
  const emptyRuleset=(s.totalAll||0)===0;
  const modeStr=Object.keys(s.byMode||{}).map(m=>m+': '+s.byMode[m]).join('  ·  ')||'—';
  const stealStr=(s.steals&&s.steals.att>0)?(s.steals.ok+'/'+s.steals.att):'0';
  const noisy = s.total<NOISY ? `<div class="warn">⚠ Only ${s.total} answers under this ruleset — numbers are noisy. Accumulate more before tuning.</div>` : '';
  // Calibration measures the Normal baseline; Easier/Harder games are measured separately.
  const MODE_LABEL={normal:'Normal',easy:'Easier',hard:'Harder'};
  const modeNote = '';
  area.innerHTML=
    noisy+
    modeNote+
    `<div class="meta">${s.total} answers · steals ${stealStr} · by mode ${modeStr}</div>`+
    (emptyRuleset?'<div class="warn">No answers recorded under this ruleset yet \u2014 the tables below are empty. Play a few games, then Analyze.</div>':'')+
    '<div class="section">By Tier · All Modes</div>'+tierTable(s.byTier||{}, s.tiersByMode||{}, s.byVersion||{})+
    '<div class="section">Drift From Target · By Ruleset Version</div>'+versionChart(s.byVersion||{})+
    '<hr style="border:none;border-top:1px solid rgba(255,255,255,.12);margin:26px 0 18px;">'+
    '<div class="section">Category × Tier</div>'+
    '<div class="muted" style="font-size:11px;margin-bottom:10px;">This section only \u2014 pick a mode:</div>'+
    modeSelectorHTML()+
    matrixTable(s);
  wireModeSelector();
  renderAssistPanel();
}

function renderDetails(){
  const pane=document.getElementById('detailsPane');
  const r=RULESETS.find(x=>x.difficulty_ruleset_version===SELECTED);
  if(!r){ pane.innerHTML=''; return; }
  const prose=t=>`<div class="prose">${t?t:'<span style="color:rgba(255,255,255,.3);">(none)</span>'}</div>`;
  const created=r.created_at?new Date(r.created_at).toLocaleString():'';
  let h=`<div class="meta">Ruleset ${r.difficulty_ruleset_version} · Model: ${r.model||'—'}${created?' · '+created:''}</div>`;
  if(r.note) h+=`<div class="note">${r.note}</div>`;
  h+='<div class="dl">Tier Targets</div>';
  if(Array.isArray(r.tiers)&&r.tiers.length){
    h+='<table><tr><th>Tier</th><th>Target</th><th style="text-align:left;">Style anchor</th></tr>';
    r.tiers.forEach(t=>{ h+=`<tr><td>${t.name}</td><td>${t.pct}%</td><td style="text-align:left;font-size:12px;">${t.anchor||''}</td></tr>`; });
    h+='</table>';
  } else h+=prose(null);
  h+='<div class="dl">Reference Player</div>'+prose(r.reference_player);
  h+='<div class="dl">Audience Note</div>'+prose(r.audience_note);
  h+='<div class="dl">AI Judge Leniency</div>'+prose(r.judge_prompt);
  h+='<div class="dl">Category Overrides</div>';
  const ov=r.category_overrides;
  if(ov && typeof ov==='object' && Object.keys(ov).length){
    Object.keys(ov).forEach(k=>{ h+=`<div style="font-size:12px;font-weight:700;color:var(--gold-hi);margin:10px 0 4px;">${k}</div>`+prose(ov[k]); });
  } else h+=prose(null);
  // prose() is for text, and treats 0 as empty — but 0 is a perfectly good nudge,
  // and a null one still has a fallback the app is actually using. Both used to
  // read "(none)", which said the opposite of what was happening.
  const nudge=(v,fb)=>{
    const set = (v!==null && v!==undefined && v!=='');
    const n   = set ? Number(v) : fb;
    const sign = n>0 ? '+' : '';
    return `<div class="prose">${sign}${n} percentage points`
      + (set ? '' : ` <span style="color:rgba(255,255,255,.4);">(not set — using the built-in default)</span>`)
      + `</div>`;
  };
  h+='<div class="dl">Easier Nudge</div>'+nudge(r.easy_nudge, FALLBACK_EASY_NUDGE);
  h+='<div class="dl">Harder Nudge</div>'+nudge(r.hard_nudge, FALLBACK_HARD_NUDGE);
  pane.innerHTML=h;
}

const ADMIN_VERSION='3.20';
const ADMIN_BUILT_AT='2026-08-01T13:10:18Z';   // UTC; shown in the device's local time

function fmtBuildTime(iso){
  try{
    const d=new Date(iso);
    if(isNaN(d)) return '\u2014';
    // Localized to the device's timezone, formatted YYYY-MM-DD hh:mm AM/PM
    const p={};
    new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit',
      hour:'2-digit',minute:'2-digit',hour12:true})
      .formatToParts(d).forEach(x=>{p[x.type]=x.value;});
    const ap=(p.dayPeriod||'').replace(/\./g,'').toUpperCase();
    return `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute} ${ap}`;
  }catch(e){ return '\u2014'; }
}
// Each screen reports its OWN build and nothing else — you're looking at this
// file, so this file's version is what answers "did my push land?".
function renderBuildFooter(){
  const el=document.getElementById('buildFooter');
  if(!el) return;
  el.textContent=`Admin ${ADMIN_VERSION} · ${fmtBuildTime(ADMIN_BUILT_AT)}`;
}

// When a screen is wedged in a room nobody is in, this beats waiting out a timeout.
document.getElementById('resetRooms').addEventListener('click', async ()=>{
  const m=document.getElementById('resetRoomsMsg');
  m.textContent='Closing\u2026';
  try{
    const r=await fetch('/api/rooms/reset',{method:'POST'});   // this page talks to its own origin
    const d=await r.json();
    m.textContent = r.ok ? `Closed ${d.closed} room${d.closed===1?'':'s'}.` : 'Failed.';
  }catch(e){ m.textContent='Could not reach the server.'; }
});

(async function init(){
  renderBuildFooter();
  try{
    RULESETS=await api('/api/rulesets');
  }catch(e){ document.getElementById('statsArea').innerHTML='<div class="muted">Couldn’t reach the server. Reload in a moment.</div>'; return; }
  if(!Array.isArray(RULESETS)||RULESETS.length===0){
    document.getElementById('statsArea').innerHTML='<div class="muted">No rulesets defined yet.</div>'; return;
  }
  const sel=document.getElementById('rsSelect');
  const short=n=>{ if(!n) return ''; const t=String(n).trim(); return t.length>42?' — '+t.slice(0,42).trim()+'\u2026':' — '+t; };
  sel.innerHTML=RULESETS.map(r=>`<option value="${r.difficulty_ruleset_version}">Ruleset ${r.difficulty_ruleset_version}${short(r.note)}</option>`).join('');
  SELECTED=RULESETS[RULESETS.length-1].difficulty_ruleset_version; // newest
  sel.value=SELECTED;
  renderDetails();          // panel starts closed, but its contents must be ready
  loadStats();
})();
</script>
